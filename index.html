
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #222;
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
}

main {
  max-width: 1100px;
  margin: 30px auto;
  padding: 20px;
}

#products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.product {
  background: white;
  padding: 15px;
  border-radius: 10px;
}

.product img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}


   

    .glossy-btn {
      position: relative;
      padding: 16px 40px;
      border: none;
      border-radius: 50px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;

      /* Gradient background */
      background: linear-gradient(
        135deg,
        #7c3aed,
        #4f46e5,
        #2563eb
      );

      
      box-shadow:
        0 8px 20px rgba(37, 99, 235, 0.4),
        inset 0 2px 2px rgba(255, 255, 255, 0.5),
        inset 0 -3px 5px rgba(0, 0, 0, 0.2);

      transition: all 0.3s ease;
      overflow: hidden;
    }

    
    .glossy-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 45%;
      border-radius: 50px;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.55),
        rgba(255, 255, 255, 0)
      );
      pointer-events: none;
    }

    
    .glossy-btn:hover {
      transform: translateY(-4px);
      box-shadow:
        0 14px 30px rgba(37, 99, 235, 0.55),
        inset 0 2px 3px rgba(255, 255, 255, 0.6),
        inset 0 -3px 5px rgba(0, 0, 0, 0.2);
    }

    
    .glossy-btn:active {
      transform: translateY(1px);
      box-shadow:
        0 5px 10px rgba(37, 99, 235, 0.3),
        inset 0 3px 5px rgba(0, 0, 0, 0.25);
    }
    
#cart {
  background: white;
  margin-top: 30px;
  padding: 20px;
  }
  </style>
</head>

<body>

  
</body>
</html>

    </style>

  <header>
    <h1>Mini shop</h1>
      <nav>
        <button class="glossy-btn">Home</button>
        <button class="glossy-btn">Products</button>
        <button class="glossy-btn">Contacts</button>
        <button class="glossy-btn">Superman</button>

      </nav>
    <button class="glossy-btn" id="cart-button">
      Cart (<span id="cart-count">0</span>)
    </button>
  </header>

  <main>
    <h2>Products</h2>

    <section id="products"></section>
   
    <section id="cart">
      <h2>Your Cart</h2>
      <div id="cart-items"></div>
      <h3>Total: $<span id="cart-total">0.00</span></h3>
      <button class="glossy-btn" id="checkout-button">Checkout</button>
    </section>
  </main>


  <script src="app.js"></script>
</body>
</html>
