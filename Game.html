<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonic Ring Dash</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #101b48;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  h1 { color: #ffdf00; margin: 12px; }
  canvas {
    display: block;
    width: min(96vw, 900px);
    height: auto;
    margin: auto;
    border: 4px solid white;
    border-radius: 10px;
    background: #65d8ff;
  }
  button {
    padding: 12px 20px;
    margin: 10px 5px;
    border: 0;
    border-radius: 10px;
    background: #ffdf00;
    font-weight: bold;
    font-size: 16px;
  }
</style>
</head>
<body>
<h1>💨 SONIC RING DASH 💨</h1>
<p>Rings: <span id="score">0</span> | Arrow keys / A-D to move, Space to jump</p>
<canvas id="game" width="900" height="450"></canvas>
<div>
  <button id="left">⬅ Left</button>
  <button id="jump">⬆ Jump</button>
  <button id="right">Right ➡</button>
  <button onclick="restart()">🔄 Restart</button>
</div>
<p id="message">Collect rings and avoid the enemy!</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");

const ground = 380;
let sonic, rings, enemy, score, camera, keys, gameOver, won;

function restart() {
  sonic = {
    x: 80, y: ground - 38, vx: 0, vy: 0,
    w: 30, h: 38, grounded: true
  };
  rings = Array.from({length: 18}, (_, i) => ({
    x: 240 + i * 95, y: ground - 65 - (i % 3) * 25,
    taken: false
  }));
  enemy = { x: 650, y: ground - 30, w: 30, h: 30 };
  score = 0;
  camera = 0;
  keys = {};
  gameOver = false;
  won = false;
  document.getElementById("message").textContent =
    "Collect rings and avoid the enemy!";
  scoreText.textContent = score;
}

function press(key, down) { keys[key] = down; }

document.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code))
    e.preventDefault();
  if (!keys[e.code] && ["Space","ArrowUp","KeyW"].includes(e.code)
      && sonic.grounded && !gameOver && !won) {
    sonic.vy = -12;
    sonic.grounded = false;
  }
  keys[e.code] = true;
});
document.addEventListener("keyup", e => keys[e.code] = false);

function holdButton(id, key) {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (key === "jump") {
      if (sonic.grounded && !gameOver && !won) {
        sonic.vy = -12;
        sonic.grounded = false;
      }
    } else keys[key] = true;
  });
  for (const ev of ["pointerup","pointerleave","pointercancel"])
    el.addEventListener(ev, () => {
      if (key !== "jump") keys[key] = false;
    });
}
holdButton("left", "left");
holdButton("right", "right");
holdButton("jump", "jump");

function drawSonic(x, y) {
  // Blue hedgehog hero
  ctx.fillStyle = "#0754ee";
  ctx.beginPath();
  ctx.moveTo(x+5,y+9);
  ctx.lineTo(x-8,y+1);
  ctx.lineTo(x+1,y+17);
  ctx.lineTo(x-5,y+22);
  ctx.lineTo(x+7,y+25);
  ctx.arc(x+14,y+17,15,0,Math.PI*2);
  ctx.fill();

  // Face
  ctx.fillStyle = "#ffd1a1";
  ctx.beginPath();
  ctx.ellipse(x+20,y+21,10,8,0,0,Math.PI*2);
  ctx.fill();

  // Eye
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.ellipse(x+21,y+10,5,8,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "black";
  ctx.beginPath();
  ctx.arc(x+23,y+10,2.5,0,Math.PI*2);
  ctx.fill();

  // Red shoes
  ctx.fillStyle = "#f52235";
  ctx.fillRect(x+2,y+31,13,7);
  ctx.fillRect(x+19,y+31,13,7);
}

function drawRing(x,y) {
  ctx.strokeStyle = "#ffcc00";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.ellipse(x,y,9,12,0,0,Math.PI*2);
  ctx.stroke();
  ctx.strokeStyle = "#fff18b";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(x-2,y-2,5,8,0,0,Math.PI*2);
  ctx.stroke();
}

function update() {
  if (gameOver || won) return;

  if (keys.ArrowRight || keys.KeyD || keys.right) sonic.vx += 0.55;
  if (keys.ArrowLeft || keys.KeyA || keys.left) sonic.vx -= 0.55;
  sonic.vx *= 0.91;
  sonic.vx = Math.max(-6, Math.min(6, sonic.vx));
  sonic.x += sonic.vx;
  sonic.x = Math.max(0, sonic.x);

  sonic.vy += 0.55;
  sonic.y += sonic.vy;

  if (sonic.y + sonic.h >= ground) {
    sonic.y = ground - sonic.h;
    sonic.vy = 0;
    sonic.grounded = true;
  }

  for (const r of rings) {
    if (!r.taken &&
        Math.abs((sonic.x+15)-r.x)<23 &&
        Math.abs((sonic.y+19)-r.y)<28) {
      r.taken = true;
      score++;
      scoreText.textContent = score;
    }
  }

  enemy.x = 650 + Math.sin(Date.now()/350)*100;

  if (sonic.x+sonic.w > enemy.x &&
      sonic.x < enemy.x+enemy.w &&
      sonic.y+sonic.h > enemy.y &&
      sonic.y < enemy.y+enemy.h) {
    gameOver = true;
    document.getElementById("message").textContent =
      "💥 Ouch! Press Restart to try again.";
  }

  camera = Math.max(0, sonic.x - 250);

  if (sonic.x > 1900) {
    won = true;
    document.getElementById("message").textContent =
      "🏆 You win! Rings collected: " + score;
  }
}

function draw() {
  ctx.clearRect(0,0,900,450);

  // Sky
  const sky = ctx.createLinearGradient(0,0,0,450);
  sky.addColorStop(0,"#50cfff");
  sky.addColorStop(1,"#c5f5ff");
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,900,450);

  // Clouds
  ctx.fillStyle = "white";
  for (let i=0;i<7;i++) {
    let x = ((i*190-camera*0.25)%1100+1100)%1100-100;
    ctx.beginPath();
    ctx.arc(x,75+(i%3)*30,22,0,Math.PI*2);
    ctx.arc(x+25,65+(i%3)*30,30,0,Math.PI*2);
    ctx.arc(x+55,78+(i%3)*30,20,0,Math.PI*2);
    ctx.fill();
  }

  // Green hills
  ctx.fillStyle = "#41bb52";
  for (let i=0;i<6;i++) {
    let x = i*220-camera*0.5;
    ctx.beginPath();
    ctx.ellipse(x+100,ground,145,90,0,Math.PI,Math.PI*2);
    ctx.fill();
  }

  // Ground
  ctx.fillStyle = "#df9a43";
  ctx.fillRect(0,ground,900,70);
  ctx.fillStyle = "#27bd42";
  ctx.fillRect(0,ground,900,12);
  ctx.strokeStyle = "#a66426";
  ctx.lineWidth = 3;
  for(let x=-(camera%40);x<900;x+=40) {
    ctx.beginPath();
    ctx.moveTo(x,ground+20);
    ctx.lineTo(x+20,ground+40);
    ctx.lineTo(x,ground+60);
    ctx.stroke();
  }

  // Rings
  rings.forEach(r => {
    if (!r.taken) drawRing(r.x-camera,r.y);
  });

  // Enemy
  let ex=enemy.x-camera;
  ctx.fillStyle="#d92a36";
  ctx.fillRect(ex,enemy.y,enemy.w,enemy.h);
  ctx.fillStyle="white";
  ctx.fillRect(ex+5,enemy.y+5,8,8);
  ctx.fillRect(ex+19,enemy.y+5,7,8);
  ctx.fillStyle="black";
  ctx.fillRect(ex+8,enemy.y+8,3,4);
  ctx.fillRect(ex+21,enemy.y+8,3,4);

  drawSonic(sonic.x-camera,sonic.y);

  if(gameOver || won) {
    ctx.fillStyle="rgba(0,0,0,0.65)";
    ctx.fillRect(0,0,900,450);
    ctx.fillStyle=won?"#ffdf00":"white";
    ctx.font="bold 42px Arial";
    ctx.textAlign="center";
    ctx.fillText(won?"LEVEL COMPLETE!":"GAME OVER",450,205);
    ctx.font="22px Arial";
    ctx.fillText("Press Restart to play again",450,250);
    ctx.textAlign="left";
  }

  requestAnimationFrame(loop);
}

function loop() {
  update();
  draw();
}

restart();
loop();
</script>
</body>
</html>
